<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Bomb Pomodoro TImer</title>
		<style>
			@font-face {
				font-family: "digital_7_mono";
				src: url("digital_7_mono.ttf");
			}
			.lcdfont {
				font-family: "digital_7_mono", monospace;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 15px;
				background-color: transparent;
				color: #e0e0e0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				user-select: none;
				overflow: hidden;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			}
			.app-header {
				margin-bottom: 10px;
				text-align: center;
			}
			.app-title {
				font-size: 1.3rem;
				font-weight: 700;
				letter-spacing: 2px;
				color: #ff4444;
				text-transform: uppercase;
				text-shadow: 0 0 10px rgba(255, 68, 68, 0.4);
				margin: 0 0 4px 0;
			}
			.mode-selector {
				display: flex;
				gap: 8px;
				margin-bottom: 12px;
				background: #252525;
				padding: 5px;
				border-radius: 8px;
				border: 1px solid #3a3a3a;
			}
			.mode-btn {
				background: transparent;
				border: none;
				color: #888;
				padding: 6px 12px;
				font-size: 0.8rem;
				font-weight: 600;
				border-radius: 6px;
				cursor: pointer;
				transition: all 0.2s ease;
			}
			.mode-btn:hover {
				color: #fff;
			}
			.mode-btn.active {
				background: #ff4444;
				color: #ffffff;
				box-shadow: 0 2px 8px rgba(255, 68, 68, 0.4);
			}
			#cuntainter {
				position: relative;
				width: 90vw;
				max-width: 480px;
				aspect-ratio: 692 / 347;
				display: flex;
				justify-content: center;
				align-items: flex-start;
			}
			#THEBOMB {
				position: relative;
				width: 100%;
				height: 100%;
				container-type: inline-size;
			}	
			#bomb {
				width: 100%;
				height: 100%;
				object-fit: contain;
				position: absolute;
				top: 0;
				left: 0;
				cursor: pointer;
				filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
				transition: transform 0.15s ease;
			}
			#bomb:hover {
				transform: scale(1.02);
			}
			#bomb:active {
				transform: scale(0.98);
			}
			#explosion {
				width: 130%;
				position: absolute;
				top: -38%;
				left: -15%;
				pointer-events: none;
				z-index: 10;
			}	
			#timer {
				color: #ff2222;
				position: absolute;
				top: 59.83%;
				left: 35.92%;
				font-size: 10.53cqw;
				line-height: 1;
				pointer-events: none;
				text-shadow: #ff0000 0 0 0.125em;
				z-index: 2;
			}
			#timerBG {
				color: #330000;
				position: absolute;
				top: 59.83%;
				left: 35.92%;
				font-size: 10.53cqw;
				line-height: 1;
				pointer-events: none;
				z-index: 1;
			}
			.controls {
				display: flex;
				gap: 10px;
				margin-top: 5px;
			}
			.ctrl-btn {
				padding: 8px 16px;
				font-size: 0.85rem;
				font-weight: 700;
				letter-spacing: 1px;
				border: none;
				border-radius: 6px;
				cursor: pointer;
				transition: all 0.2s ease;
				text-transform: uppercase;
			}
			.btn-start {
				background: #2e7d32;
				color: #fff;
			}
			.btn-start:hover {
				background: #388e3c;
				box-shadow: 0 0 10px rgba(56, 142, 60, 0.4);
			}
			.btn-pause {
				background: #d84315;
				color: #fff;
			}
			.btn-pause:hover {
				background: #f4511e;
				box-shadow: 0 0 10px rgba(244, 81, 30, 0.4);
			}
			.btn-reset {
				background: #424242;
				color: #ccc;
			}
			.btn-reset:hover {
				background: #616161;
				color: #fff;
			}
			.btn-focus {
				background: #7b1fa2;
				color: #fff;
			}
			.btn-focus:hover {
				background: #8e24aa;
				box-shadow: 0 0 10px rgba(142, 36, 170, 0.4);
			}
			.app-header, .mode-selector, .controls, .options {
				transition: opacity 0.25s ease, visibility 0.25s ease;
			}
			body.focus-mode .app-header,
			body.focus-mode .mode-selector,
			body.focus-mode .controls,
			body.focus-mode .options {
				visibility: hidden !important;
				opacity: 0 !important;
				pointer-events: none !important;
			}
			.options {
				margin-top: 10px;
				display: flex;
				align-items: center;
				gap: 8px;
				font-size: 0.75rem;
				color: #888;
			}
			.options label {
				cursor: pointer;
				display: flex;
				align-items: center;
				gap: 5px;
			}
		</style>
	</head>
	<body onload="Init()"> 
		<div class="app-header">
			<h1 class="app-title">BOMB TIMER</h1>
		</div>

		<div class="mode-selector">
			<button class="mode-btn active" id="mode-work" onclick="SetMode('work')">WORK (50m)</button>
			<button class="mode-btn" id="mode-short" onclick="SetMode('short')">SHORT BREAK (10m)</button>
			<button class="mode-btn" id="mode-long" onclick="SetMode('long')">LONG BREAK (30m)</button>
		</div>

		<div id="cuntainter">	
			<div id="THEBOMB"></div>		
			<div id="THEEXPLOSION"></div>		
		</div>

		<div class="controls">
			<button class="ctrl-btn btn-start" id="start-btn" onclick="StartTimer()">PLANT (START)</button>
			<button class="ctrl-btn btn-pause" id="pause-btn" onclick="PauseTimer()">DEFUSE (PAUSE)</button>
			<button class="ctrl-btn btn-reset" onclick="ResetTimer()">RESET</button>
			<button class="ctrl-btn btn-focus" id="focus-btn" onclick="ToggleFocusMode(event)">FOCUS</button>
		</div>

		<div class="options">
			<label>
				<input type="checkbox" id="holiday-check" onchange="ToggleHoliday(this.checked)" checked>
				Christmas Edition
			</label>
		</div>

		<script>
			// Pomodoro Modes (minutes)
			var MODES = {
				work: 50,
				short: 10,
				long: 30
			};
			var currentMode = 'work';
			var initialMinutes = 50;
			var initialSeconds = 0;
			var todayIsChristmas = true;
			
			// Global state
			var minutes = 50;
			var seconds = 0;
			var isRunning = false;
			var refreshIntervalId = 0;
			var refreshIntervalId2 = 0;
			var showTimer = true;
			var flashCount = 0;
			
			function PlayAudio(filename) {
				try {
					var audio = new Audio(filename);
					audio.play().catch(function(e) { console.log("Audio play deferred:", e); });
				} catch(e) {}
			}
			 
			function Init() { 
				UpdateBombGraphic();
				ResetTimer();
			}

			function UpdateBombGraphic() {
				var bombContainer = document.getElementById("THEBOMB");
				var imageSrc = todayIsChristmas ? "bomb_christmas.png" : "bomb.png";
				bombContainer.innerHTML = 
					'<img src="' + imageSrc + '" id="bomb" onclick="ToggleTimer()">' +
					'<div id="timerBG" class="lcdfont">00:00</div>' +
					'<div id="timer" class="lcdfont">00:00</div>';
				document.getElementById("THEEXPLOSION").innerHTML = '';
				UpdateDisplay();
			}

			function ToggleHoliday(enabled) {
				todayIsChristmas = enabled;
				UpdateBombGraphic();
			}

			function ToggleFocusMode(e) {
				if (e) {
					if (e.stopPropagation) e.stopPropagation();
				}
				document.body.classList.toggle('focus-mode');
			}

			document.addEventListener('click', function(e) {
				if (document.body.classList.contains('focus-mode')) {
					if (e.target.id !== 'bomb' && e.target.id !== 'focus-btn') {
						document.body.classList.remove('focus-mode');
					}
				}
			});

			document.addEventListener('keydown', function(e) {
				if (e.key === 'f' || e.key === 'F' || e.key === 'Escape') {
					ToggleFocusMode(e);
				}
			});

			function SetMode(mode) {
				if (MODES[mode] === undefined) return;
				currentMode = mode;
				
				document.querySelectorAll('.mode-btn').forEach(function(btn) {
					btn.classList.remove('active');
				});
				document.getElementById('mode-' + mode).classList.add('active');
				
				initialMinutes = MODES[mode];
				initialSeconds = 0;
				ResetTimer();
			}
			 
			function TerroristsWin() { 
				document.getElementById("THEEXPLOSION").innerHTML = '<img src="explosion2.gif" id="explosion">';
				document.getElementById("THEBOMB").style.display = 'none';
				clearInterval(refreshIntervalId);
				isRunning = false;
				PlayAudio('explode.wav');
			}
			
			function ToggleTimer() {
				if (isRunning) {
					PauseTimer();
				} else {
					StartTimer();
				}
			}

			function StartTimer() {
				if (isRunning) return;
				document.getElementById("THEBOMB").style.display = 'block';
				document.getElementById("THEEXPLOSION").innerHTML = '';
				
				// If timer was at 00:00 or finished, reset before starting
				if (minutes === 0 && seconds === 0) {
					minutes = initialMinutes;
					seconds = initialSeconds;
				}

				isRunning = true;
				flashCount = 3;	
				clearInterval(refreshIntervalId);
				clearInterval(refreshIntervalId2);
				refreshIntervalId = setInterval(DecrementTimer, 1000);
				refreshIntervalId2 = setInterval(FlashTimer, 50);
				PlayAudio('armbomb.wav');
			}

			function PauseTimer() {
				if (!isRunning) return;
				clearInterval(refreshIntervalId);
				isRunning = false;
				PlayAudio('beep.wav');
			}

			function ResetTimer() {
				clearInterval(refreshIntervalId);
				clearInterval(refreshIntervalId2);
				isRunning = false;
				minutes = initialMinutes;
				seconds = initialSeconds;
				document.getElementById("THEBOMB").style.display = 'block';
				document.getElementById("THEEXPLOSION").innerHTML = '';
				UpdateDisplay();
			}

			function FlashTimer() {
				showTimer = !showTimer;	
				var timerEl = document.getElementById("timer");
				if (timerEl) {
					timerEl.style.visibility = showTimer ? "visible" : "hidden";
				}
				flashCount--;	
				if (flashCount <= 0) {
					if (timerEl) timerEl.style.visibility = "visible";
					clearInterval(refreshIntervalId2);	
				}	
			}

			function UpdateDisplay() {
				var text = (minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
				var timerEl = document.getElementById("timer");
				if (timerEl) timerEl.innerHTML = text;
			}

			function DecrementTimer() {
				if (minutes === 0 && seconds <= 10 && seconds > 0) {
					PlayAudio('beep.wav');
				}
				if (minutes === 0 && seconds === 0) {
					refreshIntervalId2 = setInterval(FlashTimer, 50);
					PlayAudio('doublebeep.wav');
				}

				if (seconds === 0) {
					if (minutes === 0) {
						TerroristsWin();
						return;
					} else {
						minutes--;
						seconds = 59;
					}
				} else {
					seconds--;
				}
				
				UpdateDisplay();
			}

			document.body.onkeyup = function(e) {
				if (e.key === " " || e.code === "Space" || e.keyCode === 32) {	
					PlayAudio('AK47_Fire1.wav');
				}
			};

			// Right-click Resize Controller
			(function() {
				var isRightDragging = false;
				var startX = 0, startY = 0;
				var startW = 0, startH = 0;
				var moved = false;
				var pendingResize = false;

				document.addEventListener('contextmenu', function(e) {
					e.preventDefault();
				});

				window.addEventListener('mousedown', function(e) {
					if (e.button === 2) { // Right click
						isRightDragging = true;
						moved = false;
						startX = e.screenX;
						startY = e.screenY;
						startW = window.innerWidth;
						startH = window.innerHeight;
					}
				}, true);

				window.addEventListener('mousemove', function(e) {
					if (!isRightDragging) return;
					var dx = e.screenX - startX;
					var dy = e.screenY - startY;
					if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
						moved = true;
					}
					if (!moved) return;

					var newW = Math.max(260, Math.round(startW + dx));
					var newH = Math.max(280, Math.round(startH + dy));

					if (!pendingResize && window.pywebview && window.pywebview.api) {
						pendingResize = true;
						window.pywebview.api.resize(newW, newH).then(function() {
							pendingResize = false;
						}).catch(function() {
							pendingResize = false;
						});
					}
				}, true);

				window.addEventListener('mouseup', function(e) {
					if (e.button === 2) {
						isRightDragging = false;
					}
				}, true);
			})();
		</script>
	</body>
</html>
